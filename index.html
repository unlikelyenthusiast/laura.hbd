<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Happy Birthday!</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="birthday-container">

   

    <img
      src="bg.png"
      class="birthday-background"
    >

<!-- =====================================
         PHOTO CONFETTI
    ====================================== -->

    <div class="photo-confetti">

      <img
        src="k&a.png"
        class="mini-photo small"
        style="top: 5%; left: 4%;"
        alt=""
      >

      <img
        src="k&a.png"
        class="mini-photo medium"
        style="top: 18%; left: 15%;"
        alt=""
      >

      <img
        src="k&a.png"
        class="mini-photo small"
        style="bottom: 6%; right: 32%;"
        alt=""
      >

      <img
        src="k&a.png"
        class="mini-photo medium"
        style="top: 8%; right: 16%;"
        alt=""
      >

      <img
        src="k&a.png"
        class="mini-photo small"
        style="top: 28%; right: 4%;"
        alt=""
      >

      <img
        src="k&a.png"
        class="mini-photo medium"
        style="top: 45%; left: 3%;"
        alt=""
      >

      <img
        src="k&a.png"
        class="mini-photo small"
        style="top: 62%; left: 12%;"
        alt=""
      >

    

      <img
        src="k&a.png"
        class="mini-photo small"
        style="bottom: 10%; left: 28%;"
        alt=""
      >

      

      <img
        src="k&a.png"
        class="mini-photo small"
        style="bottom: 25%; right: 20%;"
        alt=""
      >

      <img
        src="k&a.png"
        class="mini-photo medium"
        style="top: 48%; right: 5%;"
        alt=""
      >

    </div>



    <!-- =====================================
         CANDLES
         Candles are added here when clicked
    ====================================== -->

    <div id="candle-layer"></div>


    <!-- =====================================
         MAIN CONTENT
    ====================================== -->

    <div class="main-content">
    </div>

  </div>


  <!-- Confetti library MUST load first -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.3.2"></script>

  <!-- Your JavaScript -->
  <script src="script.js"></script>

</body>

</html>
